services:
  redis:
    image: redis:7-alpine
    container_name: seedlings-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    container_name: seedlings-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: seedlings
      POSTGRES_PASSWORD: seedlings_dev_2024
      POSTGRES_DB: seedlings
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seedlings"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: seedlings-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: seedlings
      MINIO_ROOT_PASSWORD: seedlings_dev_2024
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: seedlings-backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://seedlings:seedlings_dev_2024@postgres:5432/seedlings
      - S3_ENDPOINT=http://minio:9000
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: seedlings-frontend
    ports:
      - "5173:80"
    env_file: .env
    depends_on:
      - backend

volumes:
  redis-data:
  postgres-data:
  minio-data:
